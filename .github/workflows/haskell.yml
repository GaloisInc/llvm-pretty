name: Haskell CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        os: ["ubuntu-24.04"]
        ghc: ["9.8.4", "9.10.1", "9.12.4"]
        cabal: ["3.14.2.0"]
        test: [true]
        build-targets: ["all"]
      fail-fast: false
    name: ${{ matrix.os }} - GHC ${{ matrix.ghc }} - Cabal ${{ matrix.cabal }}
    uses: GaloisInc/.github/.github/workflows/haskell-ci.yml@v2
    with:
      cabal: ${{ matrix.cabal }}
      cache-key-prefix: v3b
      ghc: ${{ matrix.ghc }}
      os: ${{ matrix.os }}
      test: ${{ matrix.test }}
      build-targets: ${{ matrix.build-targets }}
